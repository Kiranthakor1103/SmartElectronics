<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="se-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="35%" stop-color="#0e2358" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Edge Glow Gradient -->
    <linearGradient id="se-grad-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9" />
    </linearGradient>

    <!-- Bolt Gradient Primary -->
    <linearGradient id="se-grad-bolt-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Bolt Gradient Secondary -->
    <linearGradient id="se-grad-bolt-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Chip Circuit Traces -->
    <linearGradient id="se-grad-circuits" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#a5f3fc" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="se-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="se-soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Rounded Container (Squircle) -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#se-grad-bg)" filter="url(#se-soft-shadow)" />

  <!-- Outer Bezel Glow -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="none" stroke="url(#se-grad-edge)" stroke-width="14" />

  <!-- Circuit Micro-traces & Node Dots -->
  <g stroke="url(#se-grad-circuits)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top left circuit trace -->
    <path d="M 100 170 L 165 170 L 205 210" fill="none" />
    <circle cx="100" cy="170" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
    
    <!-- Top right circuit trace -->
    <path d="M 412 160 L 345 160 L 310 195" fill="none" />
    <circle cx="412" cy="160" r="10" fill="#67e8f9" stroke="#ffffff" stroke-width="2" />

    <!-- Bottom left circuit trace -->
    <path d="M 105 345 L 165 345 L 200 310" fill="none" />
    <circle cx="105" cy="345" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />

    <!-- Bottom right circuit trace -->
    <path d="M 405 345 L 340 345 L 305 310" fill="none" />
    <circle cx="405" cy="345" r="10" fill="#67e8f9" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Glowing Aura behind bolt -->
  <path d="M 285 70 L 175 250 L 260 250 L 225 442 L 355 235 L 270 235 Z"
        fill="#06b6d4" opacity="0.4" filter="url(#se-glow)" />

  <!-- Dynamic SmartElectronics Energy Lightning Bolt -->
  <path d="M 285 70 L 175 250 L 260 250 L 225 442 L 260 242 Z"
        fill="url(#se-grad-bolt-l)" />

  <path d="M 285 70 L 260 242 L 225 442 L 355 235 L 270 235 Z"
        fill="url(#se-grad-bolt-r)" />

  <!-- Center Core Lightning Spark -->
  <polygon points="275,100 215,245 265,245 240,380 325,240 270,240"
           fill="#ffffff" opacity="0.92" />

  <!-- Tech Dots / Accents on bolt tip -->
  <circle cx="285" cy="70" r="6" fill="#ffffff" />
  <circle cx="225" cy="442" r="6" fill="#a5f3fc" />
</svg>
