name: Enterprise CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── 1. Backend Verification (Node.js + Jest + TypeScript) ──
  backend-quality-gate:
    name: Backend Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: TypeScript Type Check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run Jest Test Suites
        working-directory: backend
        run: npm test -- --coverage

  # ── 2. Admin Console Verification (Next.js 16) ──
  admin-quality-gate:
    name: Admin Console Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install Admin Dependencies
        working-directory: admin
        run: npm ci

      - name: TypeScript Type Check
        working-directory: admin
        run: npx tsc --noEmit

      - name: Build Next.js Production Bundle
        working-directory: admin
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ── 3. Customer Storefront Verification (Next.js 16) ──
  frontend-quality-gate:
    name: Storefront Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Type Check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint Code Quality Check
        working-directory: frontend
        run: npm run lint -- --quiet

      - name: Build Next.js Production Bundle
        working-directory: frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
